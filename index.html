<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railways Reservation Form</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 30px;
        }
        .container{
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            margin: auto;
        }
        h2{
            text-align: center;
        }
        table{
            width: 100%;
            border-collapse: collapse;

        }
        .btn{
            width: 100%;
            background: #0077cc;
            color: #fff;
            cursor: pointer;
        }
        .btn:hover{
            background:#005fa3;

        }

    </style>

</head>
<body>
    <div class="container">
        <h2> Online Railways Reservation Form </h2>
        <form>
            <h3> Passanger Details</h3>
            <label for="pname">Full Name:</label>
            <input type="text" id="pname" name="pname" placeholder="Enert Full name" required><br></br>
            <label for="Age">Age:</label>
            <input type="number" id="age" name="age" min="1" max="120" required><br></br>
            <label for="gender" >Gender:</label>
            <select id="gender" name="gender" >
                <option value="" >Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>

            </select><br></br>
            <label> Class of Travel:</label>
            <select>
                <option >Sleper</option>
                <option>3AC</option>
                <option >2Ac</option>
            </select><br></br>
            <button class="btn">Submit</button>
            

        </form>
    </div>
    
</body>
</html>
